name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare generated audio fixtures
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm run check:sdk
      - run: npm test
      - run: npm run pack -- 0.0.0-ci
      - run: npm run smoke:pack -- release/monky-bot-0.0.0-ci.tgz
