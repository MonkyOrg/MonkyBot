name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Published beta tag to promote unchanged, from main and with explicit approval. New betas require a PR merge.'
        required: false
        default: ''
        type: string

# Serialize both channels so concurrent runs cannot reuse versions or regress latest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require merged-main release flow
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ] || { [ "$RELEASE_EVENT" != "push" ] && [ -z "$PROMOTE_TAG" ]; }; then
            echo "Publish new betas by merging a PR into main." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release and download promotion artifact
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: node scripts/release.js prepare

      - name: Install dependencies for beta
        if: steps.release.outputs.promotion != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify SDK protocol compatibility
        if: steps.release.outputs.promotion != 'true'
        run: npm run check:sdk

      - name: Install FFmpeg for generated music fixtures
        if: steps.release.outputs.promotion != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends -qq ffmpeg
          fi
          ffmpeg -hide_banner -version
          echo "MONKY_MUSIC_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Build and test beta
        if: steps.release.outputs.promotion != 'true'
        run: npm test

      - name: Pack beta tarball
        if: steps.release.outputs.promotion != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/pack.js "$VERSION"

      # Promotion uses the published beta's complete dependency tree, not today's SDK.
      - name: Smoke test the offline installed target tarball
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm run smoke:pack -- "release/monky-bot-${VERSION}.tgz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.js publish
