name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Published beta tag to promote unchanged (e.g. v1.8.0-beta). Empty builds a beta.'
        required: false
        default: ''
        type: string

# Serialize both channels so concurrent runs cannot reuse versions or regress latest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release and download promotion artifact
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: node scripts/release.js prepare

      - name: Install dependencies for beta
        if: steps.release.outputs.promotion != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONKY_SDK_RELEASE: ${{ vars.MONKY_SDK_RELEASE }}
        run: |
          set -euo pipefail
          SDK_ENDPOINT="repos/MonkyOrg/Monky/releases?per_page=30"
          if [ -n "$MONKY_SDK_RELEASE" ]; then
            SDK_ENDPOINT="repos/MonkyOrg/Monky/releases/tags/${MONKY_SDK_RELEASE}"
          fi
          SDK_URL=$(gh api "$SDK_ENDPOINT" --jq '
            (if type == "array" then . else [.] end)
            | [.[] | select(.draft == false) | .assets[]
              | select(.name | startswith("monky-bot-sdk-"))
              | select(.name | endswith(".tgz")) | .browser_download_url]
            | .[0] // empty')
          if [ -z "$SDK_URL" ]; then
            echo "No published Monky bot-sdk artifact was found." >&2
            exit 1
          fi
          npm pkg set "dependencies.@monky/bot-sdk=$SDK_URL"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Verify SDK protocol compatibility
        if: steps.release.outputs.promotion != 'true'
        run: npm run check:sdk

      - name: Build and test beta
        if: steps.release.outputs.promotion != 'true'
        run: npm test

      - name: Pack beta tarball
        if: steps.release.outputs.promotion != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/pack.js "$VERSION"

      # Promotion uses the published beta's complete dependency tree, not today's SDK.
      - name: Smoke test the offline installed target tarball
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm run smoke:pack -- "release/monky-bot-${VERSION}.tgz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.js publish
